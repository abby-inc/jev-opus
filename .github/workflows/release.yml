name: release
# Every push to main whose package.json version has no v<version> tag yet gets that tag and a GitHub release,
# with the notes taken from the matching CHANGELOG.md section. npm publishing is deliberately not done here.
on:
  push:
    branches: [main]
permissions:
  contents: write   # create the tag and the GitHub release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck && npm test
      - name: dist/ is up to date
        run: npm run build && git diff --exit-code -- dist
      - name: tag and GitHub release (skipped if the version is already released)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md > notes.md
          test -s notes.md
          flags=()
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md "${flags[@]}"
